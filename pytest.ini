[pytest]
pythonpath = .
testpaths = tests
base_url = https://www.saucedemo.com
addopts = -ra --browser firefox --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --output reports/artifacts --junitxml=reports/junit.xml
markers =
    smoke: fast sanity checks
    regression: full regression suite
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning